[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gigamoney-automation-linux"
version = "0.1.0"
description = "Linux Android automation counterpart for GigaMoney trading workflows"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]
dev = ["pytest>=8"]

[project.scripts]
gigamoney = "gigamoney.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gigamoney*"]

[tool.setuptools.package-data]
gigamoney = ["monitor_web/*.html", "monitor_web/*.js", "monitor_web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
